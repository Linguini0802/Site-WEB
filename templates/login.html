<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="card-container">
        <h1>LOGIN</h1>

        {% if erro %}
        <p class="alert alert-danger">{{ erro }}</p>
        {% endif %}

        {% if stats_cadastro %}
        <p class="alert alert-success">{{ stats_cadastro }}</p>
        {% endif %}

        <form method="POST" action="/" class="form-card">
            <div class="form-group">
                <label for="usuario_login">Usuário:</label>
                <input type="text" id="usuario_login" name="usuario_login" placeholder="Digite o seu usuário..." required>
            </div>
            
            <div class="form-group">
                <label for="senha_login">Senha:</label>
                <input type="password" id="senha_login" name="senha_login" placeholder="Digite a sua senha..." required>
            </div>

            <button type="submit" name="enviar_form_login" class="btn btn-primary">ACESSAR</button>
            <div class="form-footer">
                <a href="/cadaster" class="link">Cadastre-se</a>
            </div>
        </form>
    </div>
</body>
</html>
