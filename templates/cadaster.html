<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="card">
        <h1>Cadastro</h1>

        {% if erro %}
        <p class="msg msg-erro">{{ erro }}</p>
        {% endif %}

        {% if cadaster %}
        <p class="msg msg-sucesso">O usuário <strong>{{ cadaster }}</strong> foi cadastrado com sucesso!</p>
        {% endif %}

        <form action="/cadaster" method="POST">
            <div class="grupo-input">
                <label for="cadastro_usuario">Usuário:</label>
                <input type="text" id="cadastro_usuario" name="cadastro_usuario" required>
            </div>

            <div class="grupo-input">
                <label for="cadastro_senha">Senha:</label>
                <input type="password" id="cadastro_senha" name="cadastro_senha" required>
            </div>

            <button type="submit" class="btn btn-primary">Cadastrar</button>
            <div class="link-central">
                <a href="/" class="btn-link">Já tem uma conta? Faça Login</a>
            </div>
        </form>
    </div>
</body>
</html>
