<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="card-container">
        <h1>CADASTRO</h1>

        {% if erro %}
        <p class="alert alert-danger">{{ erro }}</p>
        {% endif %}

        <form method="POST" action="/cadaster" class="form-card">
            <div class="form-group">
                <label for="usuario_cadastro">Usuário:</label>
                <input type="text" id="usuario_cadastro" name="usuario_cadastro" placeholder="Digite o seu usuário..." required>
            </div>
            
            <div class="form-group">
                <label for="senha_cadastro">Senha:</label>
                <input type="password" id="senha_cadastro" name="senha_cadastro" placeholder="Digite a sua senha..." required>
            </div>

            <div class="form-group">
                <label for="senha_cadastro_confirmar">Confirmar senha:</label>
                <input type="password" id="senha_cadastro_confirmar" name="senha_cadastro_confirmar" placeholder="Confirme a sua senha..." required>
            </div>

            <button type="submit" name="enviar_form_cadastro" class="btn btn-primary">CADASTRAR</button>
            <div class="form-footer">
                <a href="/" class="link">Fazer login</a>
            </div>
        </form>
    </div>
</body>
</html>
